name: Play Store Graphics

on:
  pull_request:
    paths:
      - 'app/src/**'
      - 'play-store/**'
      - 'build.gradle.kts'
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (record = generate and commit, verify = test for regressions)'
        type: choice
        required: true
        default: 'record'
        options:
          - 'record'
          - 'verify'

jobs:
  play-store-graphics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore.base64..."
            python3 -c "import base64; open('debug.keystore', 'wb').write(base64.b64decode(open('debug.keystore.base64', 'rb').read()))"
          else
            echo "debug.keystore.base64 not found!"
          fi

      - name: Run Gradle Task
        run: |
          ACTION="${{ inputs.action }}"
          # Default to verify for PR builds
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ACTION="verify"
          fi
          
          if [ "$ACTION" = "record" ]; then
            echo "Running recordRoborazziDebug..."
            ./gradlew :app:recordRoborazziDebug --tests "com.example.playstore.*"
          else
            echo "Running verifyRoborazziDebug..."
            ./gradlew :app:verifyRoborazziDebug --tests "com.example.playstore.*"
          fi

      - name: Commit Generated Graphics
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'record' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update of Play Store graphics/screenshots"
          file_pattern: 'play-store/**/*.png'

      - name: Upload Graphics Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-store-graphics
          path: play-store/
          if-no-files-found: ignore
